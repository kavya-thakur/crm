# Render Blueprint: the app and its Redis, both on Render's free plans.
# PostgreSQL lives on Neon instead (free, and it doesn't expire like Render's free database).
# To use it: Render dashboard → New → Blueprint → pick this repo. See "Deploying" in the README.

services:
  # The whole app: Next.js + Socket.IO + the job workers, in one Node process (server.ts)
  - type: web
    name: flash
    runtime: node
    plan: free
    region: singapore
    # migrations run on every deploy; ones already applied are skipped
    buildCommand: npm ci && npx prisma generate --config prisma7.config.ts && npx prisma migrate deploy --config prisma7.config.ts && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Neon's connection string, asked for when the Blueprint is created
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: flash-redis
          property: connectionString
      # the site's own address (https://….onrender.com), for link previews and email open tracking
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  # Redis for the job queues and rate limits. Free means no disk: if it restarts, waiting jobs
  # are lost, but every job's real state is in Postgres. BullMQ needs "noeviction".
  - type: keyvalue
    name: flash-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    # reachable only from inside Render
    ipAllowList: []
